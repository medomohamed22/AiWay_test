<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AiWay Feedback Admin</title><link rel="icon" href="./aiway-logo.png">
<style>
:root{--p:#6f2dbd;--p2:#9657df;--bg:#faf8fd;--ink:#24172f;--muted:#776d80;--line:#eadff2;--white:#fff;--shadow:0 18px 55px rgba(75,34,112,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7efff,#fff 46%,#faf7fd);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:46px;height:46px;border-radius:15px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.back{color:var(--p);text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:13px;background:#fff;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(75,34,112,.06)}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:30px;margin-top:8px;color:var(--p)}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.tools{display:flex;gap:10px;align-items:center;padding:15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;background:#fff}.tools input{flex:1;min-width:220px}.tools button{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:850;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #f0e8f5;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#fcfafd;position:sticky;top:0}.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850}.models{background:#eee4ff;color:#6331a4}.tools-badge{background:#e8f8f1;color:#147452}.other{background:#fff2dd;color:#9a5d00}.idea{max-width:470px;white-space:pre-wrap;line-height:1.55}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.brand h1{font-size:18px}}@media(max-width:460px){.stats{grid-template-columns:1fr}.back{font-size:12px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><img src="./aiway-logo.png" alt="AiWay"><div><h1>Feedback Dashboard</h1><p>Anonymous visitor opinions, newest first</p></div></div><a class="back" href="./index.html">← Public page</a></div>
<div class="stats"><div class="stat"><span>Total responses</span><b id="total">—</b></div><div class="stat"><span>All models</span><b id="models">—</b></div><div class="stat"><span>Simple tools</span><b id="tools">—</b></div><div class="stat"><span>Other ideas</span><b id="other">—</b></div></div>
<div class="panel"><div class="tools"><input id="adminKey" type="password" autocomplete="current-password" placeholder="Admin access key"><input id="search" type="search" placeholder="Search ideas or languages..."><select id="filter"><option value="all">All responses</option><option value="all_models">All AI models</option><option value="simple_tools">Simple AI tools</option><option value="other">Other ideas</option></select><button id="refresh">Refresh</button></div><div class="table-wrap"><div class="loading" id="state">Loading feedback...</div><table id="table" hidden><thead><tr><th>#</th><th>Choice</th><th>Idea</th><th>Language</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
let data=[];const state=document.getElementById('state'),table=document.getElementById('table'),rows=document.getElementById('rows');
function labelChoice(v,idea){if(v==='all_models')return['All AI models','models'];if(v==='simple_tools')return['Simple AI tools','tools-badge'];return[idea?'Other idea':'No choice','other']}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;const filtered=data.filter(x=>{const isOther=!x.choice&&x.idea;const matchFilter=f==='all'||x.choice===f||(f==='other'&&isOther);const text=((x.idea||'')+' '+(x.language||'')).toLowerCase();return matchFilter&&(!q||text.includes(q))});rows.innerHTML='';filtered.forEach((x,i)=>{const [label,cls]=labelChoice(x.choice,x.idea);const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td><span class="badge ${cls}">${label}</span></td><td class="idea"></td><td>${escapeHtml(x.language||'—')}</td><td>${new Date(x.created_at).toLocaleString()}</td>`;tr.querySelector('.idea').textContent=x.idea||'—';rows.appendChild(tr)});state.style.display=filtered.length?'none':'block';state.textContent=filtered.length?'':'No matching feedback found.';table.hidden=!filtered.length}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){const adminKey=document.getElementById('adminKey').value.trim();if(!adminKey){state.style.display='block';state.textContent='Enter the admin access key, then press Refresh.';table.hidden=true;return}state.style.display='block';state.textContent='Loading feedback...';table.hidden=true;try{const r=await fetch('/api/feedback',{headers:{'x-admin-key':adminKey}});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||'Request failed')}data=await r.json();document.getElementById('total').textContent=data.length;document.getElementById('models').textContent=data.filter(x=>x.choice==='all_models').length;document.getElementById('tools').textContent=data.filter(x=>x.choice==='simple_tools').length;document.getElementById('other').textContent=data.filter(x=>!x.choice&&x.idea).length;render()}catch(e){console.error(e);state.textContent=e.message==='Unauthorized'?'Invalid admin access key.':'Could not load feedback.'}}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;document.getElementById('adminKey').addEventListener('keydown',e=>{if(e.key==='Enter')load()});state.textContent='Enter the admin access key, then press Refresh.';
</script></body></html>
